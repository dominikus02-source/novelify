<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#E8C98A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="1" fill="rgba(201,169,110,0.15)"/>
  <rect x="0" y="629" width="1200" height="1" fill="rgba(201,169,110,0.15)"/>
  <!-- Logo mark -->
  <rect x="100" y="240" width="56" height="56" rx="14" fill="url(#gold)"/>
  <text x="128" y="278" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#080808" text-anchor="middle">N</text>
  <!-- Brand -->
  <text x="172" y="280" font-family="Georgia,serif" font-size="36" font-weight="600" fill="#F5F5F7" letter-spacing="-0.5">Novelify</text>
  <!-- Tagline -->
  <text x="100" y="340" font-family="system-ui,sans-serif" font-size="22" fill="#8E8E93" letter-spacing="0.2">AI-powered novel writing studio</text>
  <!-- Feature pills -->
  <rect x="100" y="380" width="110" height="32" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="155" y="401" font-family="system-ui,sans-serif" font-size="13" fill="#A78BFA" text-anchor="middle">Write</text>
  <rect x="220" y="380" width="110" height="32" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="275" y="401" font-family="system-ui,sans-serif" font-size="13" fill="#C9A96E" text-anchor="middle">Revise</text>
  <rect x="340" y="380" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="405" y="401" font-family="system-ui,sans-serif" font-size="13" fill="#34D399" text-anchor="middle">Translate</text>
  <rect x="480" y="380" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="545" y="401" font-family="system-ui,sans-serif" font-size="13" fill="#60A5FA" text-anchor="middle">Publish</text>
  <!-- URL -->
  <text x="100" y="450" font-family="system-ui,sans-serif" font-size="15" fill="#636366">novelify.online</text>
</svg>
