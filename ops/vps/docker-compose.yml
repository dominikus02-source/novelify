name: novelify-prod

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile.vps
      secrets:
        - app_env
    image: novelify/web:${IMAGE_TAG:-local}
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 3g
    pids_limit: 768
    stop_grace_period: 20s
    env_file:
      - ${NOVELIFY_CONFIG_DIR:-/opt/bahasacerdas/config/novelify}/web.env
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      bc_edge:
        aliases:
          - novelify-web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000',{redirect:'manual'}).then(r=>{if(r.status<200||r.status>=400)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "4"

secrets:
  app_env:
    file: ${NOVELIFY_CONFIG_DIR:-/opt/bahasacerdas/config/novelify}/web.env

networks:
  bc_edge:
    external: true
    name: bahasacerdas-prod_edge
